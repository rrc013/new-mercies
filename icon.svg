<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2A47"/>
      <stop offset="1" stop-color="#3E4E78"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCE2A0"/>
      <stop offset="1" stop-color="#F0A85A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#E8A866" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F7C978" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="above"><rect x="0" y="0" width="512" height="330"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g stroke="#FBD98A" stroke-width="9" stroke-linecap="round" opacity="0.8">
    <line x1="256" y1="124" x2="256" y2="154"/>
    <line x1="146" y1="170" x2="162" y2="190"/>
    <line x1="366" y1="170" x2="350" y2="190"/>
    <line x1="90" y1="246" x2="116" y2="256"/>
    <line x1="422" y1="246" x2="396" y2="256"/>
  </g>
  <circle cx="256" cy="330" r="120" fill="url(#sun)" clip-path="url(#above)"/>
  <!-- cross standing on the horizon, in front of the rising sun -->
  <g fill="#1B2440">
    <rect x="245" y="176" width="22" height="156" rx="3"/>
    <rect x="208" y="222" width="96" height="20" rx="3"/>
  </g>
  <rect x="0" y="330" width="512" height="182" fill="#24304F"/>
  <rect x="92" y="326" width="328" height="8" rx="4" fill="#FBD98A"/>
  <g fill="#3B4A72">
    <rect x="150" y="362" width="212" height="6" rx="3"/>
    <rect x="196" y="388" width="120" height="6" rx="3"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
